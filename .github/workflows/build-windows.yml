name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable

      - name: Sync app version from pubspec.yaml
        run: |
          $pubspecVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $semVer = $pubspecVersion.Split('+')[0]
          echo "APP_VERSION=$semVer" >> $env:GITHUB_ENV
          "const String kAppVersion = '$semVer';" | Out-File -FilePath lib/core/app_version.dart -Encoding utf8

      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ($env:GITHUB_REF_NAME -ne "v$env:APP_VERSION") {
            throw "Tag $env:GITHUB_REF_NAME, pubspec esa $env:APP_VERSION"
          }

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Download VC++ Redistributable
        run: Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile windows\installer\vc_redist.x64.exe

      - name: Build installer
        run: iscc /DMyAppVersion=${{ env.APP_VERSION }} windows\installer\miraprint.iss

      - uses: actions/upload-artifact@v4
        with:
          name: miraprint-windows-installer
          path: windows/installer/Output/MiraprintSetup.exe

      - name: Create version.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $exe = "windows/installer/Output/MiraprintSetup.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          @{
            windows = @{
              version      = $env:APP_VERSION
              download_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/MiraprintSetup.exe"
              sha256       = $hash
            }
          } | ConvertTo-Json -Depth 3 | Set-Content version.json -Encoding utf8

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME windows/installer/Output/MiraprintSetup.exe version.json --title "Miraprint $env:APP_VERSION" --generate-notes
