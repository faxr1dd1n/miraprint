name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable

      - name: Sync app version from pubspec.yaml
        run: |
          $pubspecVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $semVer = $pubspecVersion.Split('+')[0]
          echo "APP_VERSION=$semVer" >> $env:GITHUB_ENV
          "const String kAppVersion = '$semVer';" | Out-File -FilePath lib/core/app_version.dart -Encoding utf8

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc /DMyAppVersion=${{ env.APP_VERSION }} windows\installer\miraprint.iss

      - uses: actions/upload-artifact@v4
        with:
          name: miraprint-windows-installer
          path: windows/installer/Output/MiraprintSetup.exe
