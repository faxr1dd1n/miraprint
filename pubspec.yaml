name: miraprint
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.6+8

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  printing: ^5.14.3
  esc_pos_utils_plus: ^2.0.4
  win32: ^6.4.0
  http: ^1.6.0
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  logging: ^1.3.0
  ffi: ^2.2.0
  image: ^4.9.2
  barcode: ^2.2.9
  window_manager: ^0.5.2
  path_provider: ^2.1.6
  tray_manager: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/miraprint_logo.png"
  macos:
    generate: true
  windows:
    generate: true

flutter:

  uses-material-design: true

  assets:
    - assets/miraprint_logo.png
    - assets/tray_icon.png
    - assets/tray_icon.ico

