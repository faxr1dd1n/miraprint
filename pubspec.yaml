name: miraprint
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.15+17

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  printing: ^5.14.3
  esc_pos_utils_plus: ^2.0.4
  win32: ^6.4.0
  http: ^1.6.0
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  logging: ^1.3.0
  ffi: ^2.2.0
  image: ^4.9.2
  barcode: ^2.2.9
  window_manager: ^0.5.2
  path_provider: ^2.1.6
  tray_manager: ^0.5.3
  flutter_svg: ^2.0.10+1
  # Miraprint tuzatishi bilan lokal nusxa — pub.dev'dagi 4.1.0 versiyasi
  # yangi Flutter SDK'da (`AssetManifest.json` endi generatsiya qilinmaydi,
  # `AssetManifest.bin` bilan almashtirilgan) ishlamaydi
  # (`packages/flutter_translate/lib/src/services/locale_file_service.dart`).
  flutter_translate:
    path: packages/flutter_translate
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# `flutter_translate` intl ^0.19.0 talab qiladi, lekin `flutter_localizations`
# SDK'dan aynan 0.20.2'ni majburlaydi (`onebuy-flutter-mobile`da ham xuddi
# shu sabab bilan qo'llanilgan). `flutter_translate` intl'dan faqat
# `Intl.defaultLocale`ni ishlatadi — 0.19→0.20 farqi bunga ta'sir qilmaydi.
dependency_overrides:
  intl: 0.20.2

flutter_launcher_icons:
  image_path: "assets/miraprint_logo.png"
  macos:
    generate: true
  windows:
    generate: true

flutter:

  uses-material-design: true

  assets:
    - assets/miraprint_logo.png
    - assets/tray_icon.png
    - assets/tray_icon.ico
    - assets/social_media/
    - assets/i18n/

